<!DOCTYPE html>
<html>
<head>
<title> Movie Recommender</title>

<style>

body{
background:#141414;
color:white;
font-family:Arial;
margin:0;
}

/* navbar */
.header{
padding:20px 40px;
font-size:28px;
font-weight:bold;
color:#e50914;
}

/* search */
.search-box{
text-align:center;
margin-top:20px;
}

.search-box input{
width:400px;
padding:12px;
border:none;
border-radius:4px;
font-size:16px;
}

.search-box button{
padding:12px 20px;
background:#e50914;
border:none;
color:white;
border-radius:4px;
cursor:pointer;
}

/* movies grid */
.movies{
display:flex;
flex-wrap:wrap;
gap:25px;
padding:40px;
justify-content:center;
}

/* card */
.card{
width:200px;
transition:0.3s;
}

.card img{
width:100%;
border-radius:8px;
}

.card:hover{
transform:scale(1.08);
}

.title{
margin-top:8px;
font-size:14px;
text-align:center;
}

</style>
</head>

<body>

<div class="header">
 MOVIE RECOMMENDER SYSTEM
</div>

<form method="POST" class="search-box">

<input type="text" name="movie" placeholder="Search movie">

<select name="language">
<option value="All">All Language</option>
<option value="Telugu">Telugu</option>
<option value="Tamil">Tamil</option>
</select>

<select name="genre">
<option value="All">All Category</option>
<option value="action">Action</option>
<option value="drama">Drama</option>
<option value="romance">Romance</option>
<option value="comedy">Comedy</option>
<option value="thriller">Thriller</option>
<option value="mass">Mass</option>
</select>

<button type="submit">Recommend</button>

</form>

<div class="movies">
{% for name in names %}
<div class="card">
<img src="{{ posters[loop.index0] }}">
<div class="title">{{ name }}</div>
</div>
{% endfor %}
</div>

</body>
</html>
